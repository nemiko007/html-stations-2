<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Station 11</title>
  </head>
  <body>
    <main>
      <h1>アカウント作成</h1>
      <form action="" method="post" novalidate>
        <div>
          <label for="email">メールアドレス（必須）</label><br />
          <input id="email" name="email" type="email" required />
        </div>

        <div>
          <label for="password">パスワード（必須・6文字以上）</label><br />
          <input id="password" name="password" type="password" required minlength="6" />
        </div>

        <div>
          <label for="nickname">ニックネーム（任意・20文字以下）</label><br />
          <input id="nickname" name="nickname" type="text" maxlength="20" />
        </div>

        <div style="margin-top:12px;">
          <button type="submit">送信</button>
        </div>
      </form>
      <script>
        // 簡単なクライアントサイドの補助: HTML5 バリデーションのメッセージ表示
        document.querySelector('form').addEventListener('submit', function (e) {
          const form = e.currentTarget;
          if (!form.checkValidity()) {
            e.preventDefault();
            form.reportValidity();
          }
        });
      </script>
    </main>
  </body>
</html>
